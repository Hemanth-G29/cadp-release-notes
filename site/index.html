<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CADP Release Notes — All Builds</title>
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#182c41;background:#f3f6fa}*{box-sizing:border-box}
body{margin:0}button,input,a{font:inherit}
header{background:#fff;border-bottom:1px solid #dce5ee;padding:16px 28px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:11px;background:#0569b5;color:#fff;display:grid;place-items:center;font-weight:800}
header h1{font-size:20px;color:#1169ac;margin:0}header p{font-size:12px;margin:4px 0 0;color:#5f7286}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 73px)}
.sidebar{background:#fff;border-right:1px solid #dce5ee;padding:24px 16px}
.sidebar h2{margin:0 0 4px 10px;font-size:15px}.hint{color:#5f7286;font-size:12px;margin:0 10px 16px}
.search{width:100%;min-height:44px;padding:10px 12px;border:1px solid #c9d5e1;background:#f7f9fb;border-radius:8px;margin-bottom:14px}
.search:focus{outline:2px solid #2683c2;outline-offset:1px}
.version-list{display:flex;flex-direction:column;gap:6px}
.version{border:1px solid transparent;border-radius:9px;background:transparent;text-align:left;width:100%;min-height:44px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#243a52;cursor:pointer}
.version:hover{background:#f0f6fb}.version:focus-visible{outline:2px solid #2683c2}
.version.active{background:#e9f4fd;border-color:#b2d8f3;box-shadow:inset 3px 0 #0874b9}
.version strong{display:block;font-size:14px}.version small{display:block;margin-top:4px;font-size:11px;color:#5f7286}
.status{font-size:10px;font-weight:800;padding:5px 7px;border-radius:6px;white-space:nowrap}
.status.draft{background:#fff1ca;color:#7a5000}.status.published{background:#e4f6ea;color:#14663e}
.empty{color:#5f7286;font-size:13px;padding:16px}
.content{padding:24px 28px 40px;min-width:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{font-size:24px;color:#136bac;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:44px;border:1px solid #bcd3e7;background:#fff;color:#0f5f97;border-radius:8px;padding:0 14px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
.btn.primary{background:#086fb3;color:#fff;border-color:#086fb3}.btn:focus-visible{outline:2px solid #2683c2;outline-offset:2px}
.frame{width:100%;height:80vh;border:1px solid #dce5ee;border-radius:10px;background:#fff;display:block}
@media(max-width:850px){header{padding:14px 16px}.app{grid-template-columns:minmax(0,1fr)}
.sidebar{min-width:0;padding:14px 16px;border-right:0;border-bottom:1px solid #dce5ee}
.version-list{flex-direction:row;overflow-x:auto;padding-bottom:4px}.version{width:auto;min-width:180px;flex:0 0 auto}
.content{padding:18px 16px}.bar h2{font-size:20px}}</style>
</head>
<body>
<header><div class="logo" aria-hidden="true">C</div><div><h1>CADP Release Notes</h1><p>QA build release history · 5 build(s)</p></div></header>
<div class="app">
<aside class="sidebar" aria-label="Release versions"><h2>Release History</h2><p class="hint">Select a version to view its notes</p>
<input id="search" class="search" type="search" placeholder="Search versions…" aria-label="Search versions">
<nav id="versions" class="version-list" aria-label="Versions"></nav></aside>
<main class="content"><div class="bar"><h2 id="title">Release Notes</h2>
<div class="actions" id="actions"><button type="button" class="btn" id="copy">Copy version link</button>
<a class="btn" id="open" target="_blank" rel="noopener">Open full page</a><a class="btn primary" id="pdf" target="_blank" rel="noopener">↓ Download PDF</a></div></div>
<iframe id="frame" class="frame" title="Release notes"></iframe></main>
</div>
<script>window.BUILDS=[{"version":23,"releaseDate":"October 16, 2026","status":"Draft","current":true},{"version":22,"releaseDate":"October 16, 2026","status":"Published","current":false},{"version":21,"releaseDate":"October 13, 2026","status":"Published","current":false},{"version":20,"releaseDate":"September 25, 2026","status":"Published","current":false},{"version":19,"releaseDate":"July 31, 2026","status":"Published","current":false}];</script>
<script>
const B=window.BUILDS,$=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sel=Number(new URLSearchParams(location.search).get('version'));
if(!B.some(b=>b.version===sel))sel=B.length?B[0].version:null;
function list(){const q=$('search').value.trim().toLowerCase();
 const m=B.filter(b=>('v'+b.version+' version '+b.version+' '+b.releaseDate+' '+b.status).toLowerCase().includes(q));
 $('versions').innerHTML=m.length?m.map(b=>'<button type="button" class="version'+(b.version===sel?' active':'')+'" data-version="'+b.version+'"'+(b.version===sel?' aria-current="page"':'')+'><span><strong>Version '+b.version+'</strong><small>'+esc(b.releaseDate||'')+(b.current?' · Current build':'')+'</small></span><span class="status '+b.status.toLowerCase()+'">'+esc(b.status)+'</span></button>').join(''):'<p class="empty">No matching versions</p>';
 document.querySelectorAll('[data-version]').forEach(e=>e.addEventListener('click',()=>choose(Number(e.dataset.version))));}
function fit(){const f=$('frame');try{f.style.height=Math.max(f.contentDocument.documentElement.scrollHeight+4,400)+'px';}catch(e){}}
function show(){if(sel==null){$('title').textContent='No release notes published yet';$('frame').hidden=true;$('actions').hidden=true;return;}
 const dir='./release-notes-v'+sel+'/';$('title').textContent='Release Notes — v'+sel;
 $('frame').title='Release notes for version '+sel;$('frame').src=dir;$('open').href=dir;$('pdf').href=dir+'index.pdf';document.title='CADP Release Notes — v'+sel;list();}
function choose(n){sel=n;history.replaceState(null,'','?version='+n);show();window.scrollTo({top:0,behavior:'smooth'});}
$('frame').addEventListener('load',fit);window.addEventListener('resize',fit);$('search').addEventListener('input',list);
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);$('copy').textContent='✓ Link copied';setTimeout(()=>{$('copy').textContent='Copy version link'},1600);}catch(e){prompt('Copy this link',location.href);}});
show();</script>
</body>
</html>
