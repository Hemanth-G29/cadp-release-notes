<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Release Notes – CADP Workspace v1.0.0 (6)</title>
<style>
body{margin:0;padding:16px;background:#eef2f6;font-family:"Segoe UI",Arial,sans-serif;color:#182c41}
#pages canvas{display:block;width:100%;max-width:1000px;height:auto;margin:0 auto 16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.also{max-width:1000px;margin:0 auto 12px;font-size:14px}.also a{color:#0f5f97;font-weight:700}
.status{text-align:center;color:#5f7286;font-size:14px;padding:40px 0}
.fallback{width:100%;height:85vh;border:0;background:#fff}</style>
</head>
<body>
<table hidden><tbody>
<tr><td>Release Version</td><td>Release 1.0.0 (6)</td></tr>
<tr><td>Release Date</td><td>March 25, 2026</td></tr>
</tbody></table>
<main id="pages" aria-label="Release notes v6"><p class="status">Loading release notes…</p></main>
<noscript><p class="also"><a href="./index.pdf">⬇ Download the release notes (PDF)</a></p></noscript>
<script type="module">
const box = document.getElementById('pages');
try {
  const pdfjs = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
  const doc = await pdfjs.getDocument('./index.pdf').promise;
  const width = Math.min(box.clientWidth || 1000, 1000);
  box.textContent = '';
  for (let n = 1; n <= doc.numPages; n++) {
    const page = await doc.getPage(n);
    const scale = (width / page.getViewport({ scale: 1 }).width) * (window.devicePixelRatio || 1);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    canvas.setAttribute('role', 'img'); canvas.setAttribute('aria-label', 'Page ' + n + ' of ' + doc.numPages);
    box.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  }
} catch (e) {
  box.innerHTML = '<iframe class="fallback" src="./index.pdf#toolbar=0&navpanes=0" title="Release notes (PDF)"></iframe>';
}</script>
</body>
</html>
