# QA release-note enforcement job. If a repo ALREADY has a .gitlab-ci.yml, paste this job into it
# (and make sure ci/check-qa-release-note.sh is present). Requires a GitLab runner.
qa-release-note-check:
  stage: test
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git bash
  script:
    - bash ci/check-qa-release-note.sh "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-origin/devops/dev}"
